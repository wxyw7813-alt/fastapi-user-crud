name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - gcp-deploy

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run tests
        run: python -m pytest --quiet

      - name: Build container image
        run: docker build --tag user-api-mysql:${{ github.sha }} .
